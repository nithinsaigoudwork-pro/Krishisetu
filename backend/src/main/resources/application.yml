server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kisansetu-backend
  datasource:
    # Defaults to H2 in-memory mode for zero-setup execution, seamlessly switchable to PostgreSQL via env vars
    url: ${DB_URL:jdbc:h2:mem:krishisetudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 5000

logging:
  level:
    com.krishisetu: INFO
    org.springframework.security: WARN
